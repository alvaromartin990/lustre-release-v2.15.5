# OBD_ALLOC_PTR_ARRAY_LARGE Test Configuration
# This file contains configuration parameters for the test modules

# Test Parameters
TEST_ITERATIONS=5
TEST_MIN_SIZE=1
TEST_MAX_SIZE=1000
KMALLOC_MAX_SIZE=1048576  # 1MB threshold

# Performance Test Parameters
PERF_TEST_SIZES="1 10 100 1000 10000"
PERF_TEST_REPETITIONS=3

# Memory Allocation Thresholds
SMALL_ALLOC_THRESHOLD=4096      # 4KB
MEDIUM_ALLOC_THRESHOLD=65536    # 64KB
LARGE_ALLOC_THRESHOLD=1048576   # 1MB

# Expected Results
EXPECTED_ALLOC_TIME_MAX_NS=10000000  # 10ms max for reasonable allocation
EXPECTED_FREE_TIME_MAX_NS=1000000    # 1ms max for reasonable deallocation

# Test Scenarios
SCENARIOS=(
    "basic:10:Basic functionality test"
    "small:1:Single entry allocation"
    "medium:100:Medium-sized allocation"
    "large:1000:Large allocation test"
    "stress:random:Stress test with random sizes"
    "edge:0:Edge case - zero allocation"
    "huge:100000:Very large allocation (may fail)"
)

# Module Information
MODULE_NAME="simple_obd_alloc_test"
MODULE_DESCRIPTION="Test module for OBD_ALLOC_PTR_ARRAY_LARGE"
MODULE_VERSION="1.0"

# Paths
KERNEL_BUILD_DIR="/lib/modules/$(uname -r)/build"
LOG_DIR="/tmp"
RESULTS_DIR="/tmp/obd_alloc_test_results"

# Debug Options
DEBUG_ALLOCATION=1
DEBUG_TIMING=1
DEBUG_VERIFICATION=1

# Safety Limits
MAX_ALLOCATION_SIZE=1000000  # Maximum number of entries to allocate
MAX_TEST_DURATION=300        # Maximum test duration in seconds

# Expected Structure Sizes (in bytes)
EXPECTED_SIMPLE_FID_SIZE=16
EXPECTED_SIMPLE_INODE_ID_SIZE=8
EXPECTED_SIMPLE_IDMAP_CACHE_SIZE=32

# Test Verification
VERIFY_RANDOM_DATA=1
VERIFY_MEMORY_PATTERN=1
VERIFY_ALLOCATION_METHOD=1
